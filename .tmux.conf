# bind prefix to C-a
unbind C-b
set-option -g prefix C-a
bind-key M-b send-prefix

# mouse mode
set -g mouse on

set-option -g renumber-windows on

# remap split window
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# start at index 1
set -g base-index 1
setw -g pane-base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# theme config
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @theme_disable_plugins 1
set -g @theme_variation 'storm'
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_transparent_status_bar 'true'
set -g @theme_transparent_left_separator_inverse ''
set -g @theme_transparent_right_separator_inverse ''

# vim navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux run-shell uses this PATH. After macOS Tahoe replaced nix-darwin's
# /etc/zshrc, /bin/bash (3.2) is found before nix bash 5.3 and the Tokyo
# Night theme fails (it needs associative arrays). Keep nix/Homebrew first.
set-environment -g PATH "/run/current-system/sw/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
